name: checks
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        # Intel evita a fila de capacidade ARM que cancelou os últimos jobs sem executar.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Instalar dependências do site
        run: npm ci
        working-directory: landing
      - name: Testes do site
        run: npm test
        working-directory: landing
      - name: Build e pré-renderização das duas rotas
        run: npm run build
        working-directory: landing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m ruff check athenix tests scripts migrations
      - run: python -m ruff format --check athenix tests scripts migrations
      - run: python scripts/check_secrets.py
      - name: Não regressão do gabarito
        run: python scripts/avaliar.py --rotulo ci --comparar tests/baseline/metricas_v2.json
      - name: O export da demo reproduz o JSON versionado
        run: |
          python scripts/exportar_plano_demo.py --verificar
          python scripts/exportar_plano_demo.py --verificar --arquivo tests/fontes_impacto/dou/dou_ren20261174.html --saida landing/src/content/plano-ren1174.json
      - run: python -m pytest --junitxml=artifacts/tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: |
            artifacts/tests.xml
            artifacts/avaliacao/
